spring.application.name=workintech-backend-final-ecommerce

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/workintech_ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Tablolari ve baslangic verisini Flyway kurar; Hibernate yalniz uyumu kontrol eder.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Frontend alan adlarini snake_case bekliyor: role_id, category_id, sell_count...
spring.jackson.property-naming-strategy=SNAKE_CASE

# Bos birakilirsa her acilista rastgele anahtar uretilir (yalniz yerel gelistirme icin).
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-days=7

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://workintech-frontend-final-ecommerce.vercel.app}
